name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25", "26"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        run: docker --version

      - name: Verify
        run: make verify JAVA_VERSION=${{ matrix.java-version }}

      - name: App-driven smoke
        run: make smoke JAVA_VERSION=${{ matrix.java-version }}

  wildfly:
    name: WildFly Jakarta and Javax multi-WAR smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run app-server smoke
        run: make smoke-wildfly JAVA_VERSION=21
